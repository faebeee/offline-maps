services:
  offline-maps:
    build: .
    image: offline-maps
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # extra origins allowed to call /api, e.g. http://maps.local:8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/status').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
